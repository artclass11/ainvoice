name: Android debug preview

on:
  workflow_dispatch:
  push:
    branches:
      - android-preview

permissions:
  contents: write

jobs:
  android-debug:
    name: Build Android ARM64 debug APK
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Initialize Android project
        run: pnpm tauri android init --ci
      - name: Harden Gradle wrapper and dependency download settings
        shell: bash
        run: |
          WRAPPER="src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties"
          GRADLE_PROPS="src-tauri/gen/android/gradle.properties"
          test -f "$WRAPPER" || (echo "Gradle wrapper properties were not generated." && exit 1)
          if ! grep -q '^networkTimeout=' "$WRAPPER"; then
            printf '\nnetworkTimeout=120000\n' >> "$WRAPPER"
          fi
          printf '\n# Disable configuration cache until Kotlin Gradle plugin compatibility is verified.\norg.gradle.configuration-cache=false\norg.gradle.parallel=false\n' >> "$GRADLE_PROPS"

      - name: Increase Gradle wrapper download timeout
        shell: bash
        run: |
          WRAPPER_PROPERTIES="src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties"
          test -f "$WRAPPER_PROPERTIES" || (echo "Generated Gradle wrapper properties not found." && exit 1)
          if grep -q '^networkTimeout=' "$WRAPPER_PROPERTIES"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$WRAPPER_PROPERTIES"
          else
            echo 'networkTimeout=120000' >> "$WRAPPER_PROPERTIES"
          fi
      - name: Cache generated Gradle wrapper and dependencies
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
      - name: Generate Android icons
        run: pnpm tauri icon public/icon.svg
      - name: Build ARM64 debug APK
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_HOME="$NDK_HOME"
          export ANDROID_NDK_ROOT="$NDK_HOME"
          test -d "$NDK_HOME" || (echo "Pinned Android NDK was not installed." && exit 1)
          export GRADLE_OPTS="-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
          for attempt in 1 2 3 4 5; do
            echo "Android build attempt $attempt of 5"
            if pnpm tauri android build --debug --apk --target aarch64; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep "$((attempt * 20))"
            fi
          done
          echo "Android build failed after five attempts."
          exit 1
      - name: Verify and stage APK
        shell: bash
        run: |
          APK_PATH="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH" || (echo "Android build did not produce an APK." && exit 1)
          unzip -t "$APK_PATH"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || (echo "Android apksigner was not found." && exit 1)
          "$APKSIGNER" verify --verbose "$APK_PATH"
          APP_VERSION="$(node -p "require('./package.json').version")"
          mkdir -p artifacts/android
          cp "$APK_PATH" "artifacts/android/AInvoice_${APP_VERSION}_android_arm64_debug.apk"
      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: AInvoice-Android-ARM64-Debug
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish debug APK to early-access release
        if: github.ref == 'refs/heads/android-preview'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          gh release upload "app-v${APP_VERSION}" artifacts/android/*.apk --clobber --repo "$GITHUB_REPOSITORY"
