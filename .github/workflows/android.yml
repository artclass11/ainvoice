name: Android signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build signed Android APKs
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK and NDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Initialize Android project
        run: pnpm tauri android init --ci
      - name: Increase Gradle wrapper download timeout
        shell: bash
        run: |
          WRAPPER_PROPERTIES="src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties"
          test -f "$WRAPPER_PROPERTIES" || (echo "Generated Gradle wrapper properties not found." && exit 1)
          if grep -q '^networkTimeout=' "$WRAPPER_PROPERTIES"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$WRAPPER_PROPERTIES"
          else
            echo 'networkTimeout=120000' >> "$WRAPPER_PROPERTIES"
          fi
      - name: Cache generated Gradle wrapper and dependencies
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
      - name: Generate Android icons
        run: pnpm tauri icon public/icon.svg
      - name: Configure Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEY_BASE64" || (echo "Set ANDROID_KEY_BASE64 in repository Actions secrets." && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Set ANDROID_KEY_ALIAS in repository Actions secrets." && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Set ANDROID_KEY_PASSWORD in repository Actions secrets." && exit 1)
          mkdir -p "$RUNNER_TEMP/ainvoice-android"
          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/ainvoice-android/upload-keystore.jks"
          printf 'keyAlias=%s\npassword=%s\nstoreFile=%s\n' "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$RUNNER_TEMP/ainvoice-android/upload-keystore.jks" > src-tauri/gen/android/keystore.properties
          python scripts/patch-android-signing.py
      - name: Build signed APKs
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_HOME="$NDK_HOME"
          export ANDROID_NDK_ROOT="$NDK_HOME"
          test -d "$NDK_HOME" || (echo "Pinned Android NDK was not installed." && exit 1)
          for attempt in 1 2 3; do
            echo "Android build attempt $attempt of 3"
            if pnpm tauri android build --apk --split-per-abi; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 15))"
            fi
          done
          echo "Android build failed after three attempts."
          exit 1
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: AInvoice-Android-APKs
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
