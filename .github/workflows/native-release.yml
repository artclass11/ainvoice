name: Native desktop releases

on:
  push:
    branches:
      - "release-preview"
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  desktop:
    name: Build ${{ matrix.platform }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os: ubuntu-22.04
            target: ""
            args: ""
          - platform: windows-x64
            os: windows-latest
            target: ""
            args: ""
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev patchelf
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate native platform icons
        run: pnpm tauri icon public/icon.svg
      - name: Build and upload native installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: AInvoice v__VERSION__ — Early Access
          releaseBody: |
            AInvoice early-access native installers.
            Read docs/PLATFORMS.md and SECURITY.md before using real business data.
            macOS and Windows packages are unsigned until publisher signing secrets are configured.
            Linux packages are provided as early-access builds and must be installed according to distribution guidance.
          releaseDraft: false
          prerelease: true
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}
