  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#50df9a" stop-opacity=".28"/><stop offset="1" stop-color="#50df9a" stop-opacity="0"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1a2020"/><stop offset="1" stop-color="#101515"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#54e39b"/><stop offset="1" stop-color="#a2f2bd"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
