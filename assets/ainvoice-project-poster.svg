<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
<title id="title">AInvoice — Easy billing. Smarter business.</title>
<desc id="desc">Open-source offline-first billing app for independent shops, retailers, wholesalers and large dealers. Early-development preview under Apache-2.0.</desc>
<defs>
